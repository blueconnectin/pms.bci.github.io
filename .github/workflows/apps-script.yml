name: Deploy application

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Apps Script and the connected Cloudflare application
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - Index.html
      - Code.gs
      - .github/scripts/apps-script-sync.mjs
      - .github/workflows/apps-script.yml
      - cloudflare/**
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - tests/cloudflare.test.mjs

permissions:
  contents: read

concurrency:
  group: blueconnect-apps-script
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.APPS_SCRIPT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned clasp CLI
        run: npm install --prefix "$RUNNER_TEMP/clasp-cli" --no-audit --no-fund @google/clasp@3.4.1
      - name: Sync source and optionally update Web App
        env:
          CLASP_AUTH_JSON: ${{ secrets.CLASP_AUTH_JSON }}
          CLASP_BIN: ${{ runner.temp }}/clasp-cli/node_modules/.bin/clasp
          APPS_SCRIPT_ID: 1KnwZq7MWdh-HDyJYSixXWBJY7zScSbQU1Y33zg7I35aqaShYaK0W2tHq
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ vars.APPS_SCRIPT_DEPLOYMENT_ID }}
          PUBLISH_WEB_APP: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.APPS_SCRIPT_AUTO_PUBLISH == 'true') }}
        run: node .github/scripts/apps-script-sync.mjs

  cloudflare:
    name: Deploy payment.blueconnect.id
    needs: sync
    if: >-
      needs.sync.result == 'success' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && vars.APPS_SCRIPT_AUTO_PUBLISH == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check Cloudflare connection
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add the CLOUDFLARE_API_TOKEN repository secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Add the CLOUDFLARE_ACCOUNT_ID repository secret.'; exit 1; }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test server bridge
        run: npm run test:bridge
      - name: Build current application
        run: npm run build
      - name: Deploy the same commit to Cloudflare
        run: npx wrangler deploy
      - name: Summarize release
        run: |
          echo '### Cloudflare deployment completed' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Check https://payment.blueconnect.id/version.json for the served commit.' >> "$GITHUB_STEP_SUMMARY"
